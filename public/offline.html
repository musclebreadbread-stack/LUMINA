<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0D1118">
    <title>오프라인 · LUMINA</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #0d1118; color: #f3eee5; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; }
      main { max-width: 34rem; padding: 2rem; line-height: 1.7; }
      h1 { font-size: 1.5rem; font-weight: 500; }
      p { color: #bbb4a8; }
    </style>
  </head>
  <body>
    <main>
      <h1>연결이 끊겼습니다</h1>
      <p>인터넷 연결을 확인한 뒤 다시 시도해 주세요. 보고서와 계정 응답은 오프라인 캐시에 저장하지 않습니다.</p>
      <h1 lang="en">You are offline</h1>
      <p lang="en">Check your connection and try again. Reports and account responses are not stored in the offline cache.</p>
    </main>
  </body>
</html>
